name: Build installer EXE

# Compiles scripts/install-local-llm-gui.ps1 into a standalone Windows .exe
# via ps2exe. Because the GUI downloads the actual installer scripts from the
# repository at runtime, this artifact only needs rebuilding when the GUI
# wrapper itself changes -- so it runs on releases (versioned, downloadable)
# and manually (a throwaway "latest"), not on every push.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer exe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build exe with ps2exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Install-Module -Name ps2exe -Scope CurrentUser -Force
          Invoke-ps2exe -InputFile .\scripts\install-local-llm-gui.ps1 -OutputFile .\dist\Hermes-Local-LLM-Installer.exe -NoConsole -STA -NoError

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hermes-Local-LLM-Installer
          path: dist/Hermes-Local-LLM-Installer.exe
          if-no-files-found: error

      - name: Attach exe to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Hermes-Local-LLM-Installer.exe --clobber
